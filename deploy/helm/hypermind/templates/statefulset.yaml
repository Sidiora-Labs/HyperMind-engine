apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: initialize
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          args: [init, --path, /var/lib/hypermind, --if-missing, --json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /var/lib/hypermind}
      containers:
        - name: hypermind
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config
            - /var/lib/hypermind/hypermind.conf
            - --grpc-bind
            - 0.0.0.0:8443
            - --rest-bind
            - 0.0.0.0:8444
            - --tls-cert
            - /tls/tls.crt
            - --tls-key
            - /tls/tls.key
            - --tls-client-ca
            - /tls/ca.crt
          {{- if .Values.existingProviderSecret }}
          envFrom:
            - secretRef: {name: {{ .Values.existingProviderSecret }}}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: grpc, containerPort: 8443}
            - {name: rest, containerPort: 8444}
          readinessProbe:
            exec:
              command: [/usr/local/bin/hm, doctor, --config, /var/lib/hypermind/hypermind.conf, --require-healthy, --json]
            initialDelaySeconds: 5
            timeoutSeconds: 10
          startupProbe:
            exec:
              command: [/usr/local/bin/hm, doctor, --config, /var/lib/hypermind/hypermind.conf, --require-healthy, --json]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/hypermind}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.existingTlsSecret }}, defaultMode: 0440}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: state}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
