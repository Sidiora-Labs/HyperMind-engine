apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: {{ .Release.Name }}}
  ports:
    - {name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc}
    - {name: rest, port: {{ .Values.service.restPort }}, targetPort: rest}
