[workspace]
resolver = "3"
members = [
    "crates/hm-cli",
    "crates/hm-compose",
    "crates/hm-core",
    "crates/hm-cortex",
    "crates/hm-embed",
    "crates/hm-eval",
    "crates/hm-index",
    "crates/hm-ledger",
    "crates/hm-llm",
    "crates/hm-mcp",
    "crates/hm-proj",
    "crates/hm-schema",
    "crates/hm-serve",
    "crates/hm-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/sidiora/hypermind"

[workspace.dependencies]
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

