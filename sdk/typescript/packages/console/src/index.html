<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperMind console</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #192c3b; background: #f5f7fa; }
      body { max-width: 1120px; margin: auto; padding: 24px; }
      section { margin: 20px 0; padding: 20px; background: white; border: 1px solid #dce3eb; border-radius: 12px; }
      form, .context-navigation { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      input, select, button { font: inherit; padding: 9px; max-width: 100%; box-sizing: border-box; }
      button { cursor: pointer; } a { color: #1758aa; }
      dl { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(0, 3fr); gap: 8px 16px; }
      dt { font-weight: 600; } dd { margin: 0; overflow-wrap: anywhere; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
      .context-card { border-top: 1px solid #dce3eb; padding: 12px 0; }
      .context-empty, .context-unavailable { color: #5c6675; }
      table { display: block; max-width: 100%; overflow-x: auto; }
      @media (max-width: 600px) { body { padding: 12px; } section { padding: 14px; } dl { grid-template-columns: 1fr; } dd { margin-bottom: 10px; } form input { width: 100%; } }
    </style>
  </head>
  <body>
    <h1>HyperMind console</h1>
    <form id="console-connection">
      <label for="console-base-url">Base URL</label>
      <input id="console-base-url" name="base-url" type="url" value="https://127.0.0.1:8443" required />
      <label for="console-token">Capability token</label>
      <input id="console-token" name="token" type="password" required />
      <label for="console-connection-id">Connection id</label>
      <input id="console-connection-id" name="connection-id" type="text" value="99999999999999999999999999999999" required />
      <button type="submit">Load</button>
    </form>
    <main id="console"></main>
    <script type="module" src="app.js"></script>
  </body>
</html>
