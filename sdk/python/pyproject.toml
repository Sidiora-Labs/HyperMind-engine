[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hypermind"
version = "0.1.0"
description = "HyperMind native memory engine and async mTLS client"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["flatbuffers>=25.9.23,<26", "grpcio>=1.75.1,<2", "protobuf>=6.31.1,<7", "blake3>=1.0.8,<2"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "grpcio-tools==1.75.1"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "."
module-name = "hypermind._native"

[tool.pytest.ini_options]
asyncio_mode = "auto"

