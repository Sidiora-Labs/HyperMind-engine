[package]
name = "hypermind-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
hm-compose = { path = "../../../crates/hm-compose" }
hm-core = { path = "../../../crates/hm-core" }
hm-mcp = { path = "../../../crates/hm-mcp" }
hm-serve = { path = "../../../crates/hm-serve" }
pyo3 = { version = "0.23.5", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync"] }

[workspace]

