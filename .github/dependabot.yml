version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directories: [/, /fuzz, /sdk/python/native, /sdk/typescript/packages/engine/native]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories: [/sdk/typescript, /deploy/railway]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directories: [/sdk/python, /eval/fixtures/locomo, /deploy]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
