name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check

  deny:
    name: dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench-gate:
    name: slice 1 evaluation gate
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Compare slice against main
        shell: bash
        run: |
          if test -f crates/hm-eval/src/main.rs; then
            cargo run -p hm-eval -- gate slice1 --compare main
          else
            echo "hm-eval gate becomes executable in task 1.8"
          fi

