name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check

  deny:
    name: dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench-gate:
    name: slice 1 evaluation gate
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: taiki-e/install-action@mdbook
      - name: Compare slice against main
        shell: bash
        run: cargo run -p hm-eval -- gate slice1 --compare main
      - run: mdbook build docs

  slice7-gate:
    name: slice 7 measured evaluation gate
    needs: rust
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CENTRA_GATEWAY_URL: ${{ vars.CENTRA_GATEWAY_URL || 'https://gateway.centra.ag/v1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Require pinned public benchmark evidence
        env:
          EVIDENCE_RUN_ID: ${{ vars.SLICE7_EVIDENCE_RUN_ID }}
        run: test -n "$EVIDENCE_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: slice7-public-evidence
          path: eval
          github-token: ${{ github.token }}
          run-id: ${{ vars.SLICE7_EVIDENCE_RUN_ID }}
      - name: Install the pinned official LoCoMo scorer dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the pinned official LoCoMo scorer
        run: |
          python -m venv target/locomo-scorer-venv
          target/locomo-scorer-venv/bin/pip install -r eval/fixtures/locomo/requirements.txt
      - name: Replay public responses and compare measured results
        env:
          BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: cargo run -p hm-eval -- gate slice7 --compare "$BASE_REF"
