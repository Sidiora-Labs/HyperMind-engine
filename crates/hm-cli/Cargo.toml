[package]
name = "hm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
getrandom = "0.3.4"
hm-compose = { path = "../hm-compose" }
hm-core = { path = "../hm-core" }
hm-ledger = { path = "../hm-ledger" }
hm-schema = { path = "../hm-schema" }
hm-serve = { path = "../hm-serve" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
