[package]
name = "hm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hm"
path = "src/main.rs"

[features]
hnsw = ["hm-mcp/hnsw", "hm-serve/hnsw"]
portable = ["dep:ort", "ort/load-dynamic"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive"] }
getrandom = "0.3.4"
hm-compose = { path = "../hm-compose" }
hm-core = { path = "../hm-core" }
hm-embed = { path = "../hm-embed" }
hm-ledger = { path = "../hm-ledger" }
hm-mcp = { path = "../hm-mcp" }
hm-proj = { path = "../hm-proj" }
hm-schema = { path = "../hm-schema" }
hm-serve = { path = "../hm-serve" }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
rcgen = "0.14.7"
tempfile = "3.23.0"

[lints]
workspace = true
