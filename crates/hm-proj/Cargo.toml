[package]
name = "hm-proj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
hnsw = ["hm-index/hnsw"]

[dependencies]
blake3 = "1.8.2"
heed = "0.22.1"
hm-core = { path = "../hm-core" }
hm-index = { path = "../hm-index" }
hm-ledger = { path = "../hm-ledger" }
hm-schema = { path = "../hm-schema" }
memmap2 = "0.9.9"
roaring = "0.11.2"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3.3"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
