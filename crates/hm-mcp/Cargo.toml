[package]
name = "hm-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hm-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
hm-compose = { path = "../hm-compose" }
hm-core = { path = "../hm-core" }
hm-ledger = { path = "../hm-ledger" }
hm-schema = { path = "../hm-schema" }
hm-serve = { path = "../hm-serve" }
rmcp = { version = "3.3.0", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
