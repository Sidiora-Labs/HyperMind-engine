[package]
name = "hm-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.2"
hm-compose = { path = "../hm-compose" }
hm-core = { path = "../hm-core" }
hm-cortex = { path = "../hm-cortex" }
hm-embed = { path = "../hm-embed" }
hm-index = { path = "../hm-index", features = ["hnsw"] }
hm-ledger = { path = "../hm-ledger" }
hm-llm = { path = "../hm-llm" }
hm-mcp = { path = "../hm-mcp" }
hm-proj = { path = "../hm-proj", features = ["hnsw"] }
hm-schema = { path = "../hm-schema" }
hm-serve = { path = "../hm-serve" }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
