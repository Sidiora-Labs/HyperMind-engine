[package]
name = "hm-cortex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.2"
hm-core = { path = "../hm-core" }
hm-llm = { path = "../hm-llm" }
hm-schema = { path = "../hm-schema" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray", "std", "tls-rustls"] }
