[package]
name = "hm-fabric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hm-context = { path = "../hm-context" }
hm-core = { path = "../hm-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2.workspace = true
thiserror = "2"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time", "process"] }
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
ed25519-dalek = "2.2"
subtle = "2.6.1"
postgres = "0.19"
tar = "0.4"
base64 = "0.22.1"
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
async-nats = { version = "0.50", default-features = false, features = ["ring", "jetstream", "kv"] }
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }

getrandom = "0.3"
zeroize = "1"

[dev-dependencies]
hm-ledger = { path = "../hm-ledger" }
rcgen = "0.14"
tempfile = "3.23.0"

[lints]
workspace = true
