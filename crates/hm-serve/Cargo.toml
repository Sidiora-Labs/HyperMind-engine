[package]
name = "hm-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
hnsw = ["hm-proj/hnsw"]

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
blake3 = "1.8.2"
crc32c = "0.6.8"
hm-compose = { path = "../hm-compose" }
hm-core = { path = "../hm-core" }
hm-cortex = { path = "../hm-cortex" }
hm-embed = { path = "../hm-embed" }
hm-ledger = { path = "../hm-ledger" }
hm-proj = { path = "../hm-proj" }
hm-schema = { path = "../hm-schema" }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
prost = "0.14.3"
rustls-pemfile = "2.2.0"
subtle = "2.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "0.14.6"
utoipa = { version = "5.5.0", features = ["yaml"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
hm-mcp = { path = "../hm-mcp" }
rcgen = "0.14.7"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3.23.0"

[lints]
workspace = true
